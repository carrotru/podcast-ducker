<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcast 多軌自動閃避</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: DAW-style workspace. Timeline on the left, controls on the right, transport bar at the bottom. One dark studio theme. */
  --bg:#13161b;
  --panel:#1a1e25;
  --line:#2a303a;
  --ink:#e7eaef;
  --muted:#8d96a4;
  --accent:#f0a24b;
  --field:#0f1216;
  --btn:#252b35;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
header.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
header.top h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:12px}
.spacer{flex:1}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--btn);border:1px solid #363e4b;border-radius:6px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{background:#2e3541}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:#22170a;border-color:var(--accent);font-weight:700}
button.primary:hover{filter:brightness(1.08);background:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:#3a2b17;border-color:var(--accent);color:var(--accent)}
button.mini{padding:2px 8px;font-size:11.5px;border-radius:4px}
main{display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:0}
.tlwrap{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
#overview{height:34px;width:100%;display:block;cursor:pointer;border-bottom:1px solid var(--line);background:#101318}
.tl{display:grid;grid-template-columns:176px minmax(0,1fr);flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;align-content:start}
.heads{border-right:1px solid var(--line);background:var(--panel)}
.heads .rs{height:26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 10px;font-size:11px;color:var(--muted)}
.head{height:92px;border-bottom:1px solid var(--line);padding:7px 8px 7px 10px;display:flex;flex-direction:column;gap:4px}
.head.drop{background:#2b2418}
.head .row{display:flex;gap:5px;align-items:center;min-width:0}
.head input.name{background:transparent;border:1px solid transparent;color:var(--ink);font:inherit;font-weight:700;font-size:13.5px;width:100%;min-width:0;padding:1px 4px;border-radius:4px}
.head input.name:hover,.head input.name:focus{border-color:var(--line);background:var(--field)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.head .file{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .x{padding:0 6px;font-size:12px;line-height:18px;background:transparent;border-color:transparent;color:var(--muted)}
.head .x:hover{color:var(--ink);background:var(--btn)}
.cvwrap{position:relative;min-width:0}
#cv{display:block;width:100%;touch-action:none}
aside{overflow-y:auto;background:var(--panel);min-height:0}
section.box{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
h2{font-size:13px;margin:0;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:8px;text-wrap:balance}
.field{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center}
.field label{font-size:12.5px}
.field output{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:2px 0 0}
.hint{font-size:12px;color:var(--muted);margin:0;line-height:1.55}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:10px 6px;color:var(--muted);border-bottom:2px solid transparent;justify-content:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane[hidden]{display:none}
textarea{width:100%;min-height:130px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.55 var(--font-mono);resize:vertical}
select,input[type=text]{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font:inherit;font-size:13px;min-width:0}
input[type=text]{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:72px 1fr;gap:6px 8px;align-items:center;font-size:12.5px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.tlist{display:flex;flex-direction:column;max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.tline{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;align-items:baseline}
.tline:last-child{border-bottom:0}
.tline:hover{background:#222832}
.tline.cur{background:#2b2418}
.tline .tm{font-family:var(--font-mono);color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tline .tx{grid-column:1/-1;color:#c6ccd5}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #363e4b;border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;justify-content:center;padding:8px 0;background:var(--btn)}
.seg button+button{border-left:1px solid #363e4b}
.seg button.on{background:var(--accent);color:#22170a;font-weight:700}
.dl{color:var(--accent);font-size:12.5px;text-decoration:none;overflow-wrap:anywhere}
.dl:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.maprow{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;font-size:12.5px}
.check{display:flex;gap:7px;align-items:flex-start;font-size:12.5px}
.check input{accent-color:var(--accent);margin-top:3px}
.banner{background:#2b2418;border:1px solid #5b4321;color:#f4d4ab;font-size:12.5px;padding:9px 11px;border-radius:6px;line-height:1.55}
.progress{height:6px;background:var(--field);border-radius:3px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);width:0}
footer.transport{display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.time{font-family:var(--font-mono);font-size:15px;font-variant-numeric:tabular-nums;min-width:190px}
.time .d{color:var(--muted)}
.zoom{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.zoom input{accent-color:var(--accent);width:130px}
#status{font-size:12.5px;color:var(--muted);flex:1;min-width:220px;text-align:right;display:flex;justify-content:flex-end;align-items:center;gap:8px}
#status.err{color:#ff8a7a}
#status.ok{color:#9ad8a3}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;color:var(--muted)}
kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink);background:var(--field);white-space:nowrap}
@media (max-width:900px){
  body{overflow:auto;height:auto}
  main{grid-template-columns:1fr}
  .tl{grid-template-columns:130px minmax(0,1fr);max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Podcast 多軌自動閃避</h1>
  </div>
  <div class="spacer"></div>
  <button id="btnOpenAll" class="primary">載入音檔（可一次多選）</button>
  <input type="file" id="fileAll" accept="audio/*,.wav,.mp3,.m4a,.aac,.flac,.ogg,.aif,.aiff" multiple hidden>
  <button id="btnDemo">重新載入示範</button>
  <button id="btnUndo" title="復原（Ctrl/⌘ + Z）">復原</button>
  <button id="btnRedo" title="重做（Ctrl/⌘ + Shift + Z）">重做</button>
</header>

<main>
  <div class="tlwrap">
    <canvas id="overview" aria-label="全集總覽，點擊跳到該位置"></canvas>
    <div class="tl" id="tl">
      <div class="heads" id="heads"></div>
      <div class="cvwrap" id="cvwrap"><canvas id="cv" aria-label="時間軸"></canvas></div>
    </div>
  </div>

  <aside>
    <section class="box" id="selBox" hidden>
      <h2>選取的段落</h2>
      <p class="hint" id="selNone" hidden></p>
      <div id="selEdit" hidden>
        <div class="grid2">
          <label for="selTrack">屬於</label><select id="selTrack"></select>
          <label for="selStart">開始</label><input type="text" id="selStart" spellcheck="false">
          <label for="selEnd">結束</label><input type="text" id="selEnd" spellcheck="false">
        </div>
        <div class="btnrow" style="margin-top:10px">
          <button id="selPlay">播放此段</button>
          <button id="selSplit">在播放頭分割</button>
          <button id="selDel">刪除</button>
        </div>
      </div>
    </section>

    <div class="tabs" role="tablist">
      <button role="tab" id="tab-duck" aria-selected="true" aria-controls="pane-duck">設定</button>
      <button role="tab" id="tab-tr" aria-selected="false" aria-controls="pane-tr">逐字稿</button>
      <button role="tab" id="tab-ex" aria-selected="false" aria-controls="pane-ex">匯出</button>
    </div>

    <div class="pane" id="pane-duck" role="tabpanel">
      <section class="box">
        <div class="banner" id="demoBanner">示範音檔</div>
        <h2>閃避強度</h2>
        <div class="seg" id="presetDuck" role="group" aria-label="閃避強度">
          <button data-v="low">低</button><button data-v="mid">中</button><button data-v="high">高</button>
        </div>
        <h2>判斷講者</h2>
        <div class="seg" id="presetAn" role="group" aria-label="判斷講者的嚴格程度">
          <button data-v="low">寬鬆</button><button data-v="mid">標準</button><button data-v="high">嚴格</button>
        </div>
        <button id="btnAnalyze" hidden>重新分析</button>
        <details>
          <summary class="hint" style="cursor:pointer">自訂參數</summary>
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
            <div class="field"><label for="pDuck">降低</label><output id="oDuck"></output><input type="range" id="pDuck" min="-40" max="-3" step="1"></div>
            <div class="field"><label for="pFade">淡入淡出</label><output id="oFade"></output><input type="range" id="pFade" min="10" max="600" step="10"></div>
            <div class="field"><label for="pPre">段落前保留</label><output id="oPre"></output><input type="range" id="pPre" min="0" max="600" step="10"></div>
            <div class="field"><label for="pPost">段落後保留</label><output id="oPost"></output><input type="range" id="pPost" min="0" max="1000" step="10"></div>
            <div class="field"><label for="aDom">高於串音</label><output id="oDom"></output><input type="range" id="aDom" min="1" max="18" step="0.5"></div>
            <div class="field"><label for="aGate">高於底噪</label><output id="oGate"></output><input type="range" id="aGate" min="0" max="40" step="1"></div>
            <div class="field"><label for="aGap">合併停頓</label><output id="oGap"></output><input type="range" id="aGap" min="0" max="2000" step="50"></div>
            <div class="field"><label for="aMin">忽略短音</label><output id="oMin"></output><input type="range" id="aMin" min="0" max="1500" step="50"></div>
          </div>
        </details>
        <details>
          <summary class="hint" style="cursor:pointer">快速鍵</summary>
          <div class="keys" style="margin-top:8px">
            <span><kbd>Space</kbd></span><span>播放／暫停</span>
            <span><kbd>Delete</kbd></span><span>刪除段落</span>
            <span><kbd>N</kbd></span><span>下一個待確認</span>
            <span><kbd>S</kbd></span><span>在播放頭分割</span>
            <span><kbd>I</kbd> <kbd>O</kbd></span><span>開始／結束設到播放頭</span>
            <span><kbd>←</kbd> <kbd>→</kbd></span><span>移動 1 秒（Shift：5 秒）</span>
            <span><kbd>Ctrl/⌘</kbd>＋滾輪</span><span>縮放</span>
            <span><kbd>Ctrl/⌘ Z</kbd></span><span>復原（Shift：重做）</span>
          </div>
        </details>
      </section>
    </div>

    <div class="pane" id="pane-tr" role="tabpanel" hidden>
      <section class="box">
        <div class="btnrow">
          <button id="trCopy" class="primary">① 複製 AI 指令</button>
          <button id="trAI" hidden>讓 Claude 判斷</button>
        </div>
        <textarea id="trText" spellcheck="false" placeholder="② 貼上 AI 的回覆"></textarea>
        <input type="file" id="trFile" accept=".srt,.vtt,.txt,.json,text/*,application/json" hidden>
        <div class="btnrow"><button id="trPick" class="mini">選擇檔案</button></div>
        <p class="hint" id="trMsg"></p>
        <div id="mapBox" hidden style="display:flex;flex-direction:column;gap:6px">
          <h2>③ 對應音檔</h2>
          <div id="mapRows" style="display:flex;flex-direction:column;gap:6px"></div>
        </div>
      </section>
      <section class="box" id="tlistBox" hidden>
        <h2>逐字稿 <span class="hint" id="trCount"></span></h2>
        <div class="tlist" id="tlist"></div>
      </section>
    </div>

    <div class="pane" id="pane-ex" role="tabpanel" hidden>
      <section class="box">
        <h2>匯出</h2>
        <div class="grid2">
          <label for="exSuffix">檔名加上</label>
          <input type="text" id="exSuffix" value="（降噪）" spellcheck="false" style="font-family:var(--font-body)">
          <span></span><span class="hint" id="exPreview"></span>
          <label for="exBits">位元深度</label>
          <select id="exBits"><option value="24">24-bit</option><option value="16">16-bit</option></select>
        </div>
        <label class="check"><input type="checkbox" id="exMix"><span>另外輸出混音檔</span></label>
        <label class="check"><input type="checkbox" id="exJson" checked><span>附上段落資料（JSON）</span></label>
        <button id="btnExport" class="primary">匯出</button>
        <div class="progress" id="exProg" hidden><div></div></div>
        <p class="hint" id="exMsg"></p>
        <button id="exRetry" hidden>再下載一次</button>
        <div id="exLinks" hidden style="display:flex;flex-direction:column;gap:4px"></div>
      </section>
      <section class="box">
        <h2>專案</h2>

        <div class="btnrow">
          <button id="btnSaveProj">儲存專案（JSON）</button>
          <button id="btnOpenProj">開啟專案</button>
          <input type="file" id="projFile" accept=".json,application/json" hidden>
        </div>
      </section>
    </div>
  </aside>
</main>

<footer class="transport">
  <button id="btnPlay" class="primary" style="min-width:92px;justify-content:center">▶ 播放</button>
  <button id="btnHome" title="回到開頭">⏮ 開頭</button>
  <span class="time"><span id="tNow">00:00.000</span> <span class="d">/ <span id="tDur">00:00</span></span></span>
  <span style="display:inline-flex;gap:4px;align-items:center">
    <button id="revPrev" title="上一個待確認（Shift + N）">◀</button>
    <span id="revLabel" style="font-size:12.5px;min-width:96px;text-align:center"></span>
    <button id="revNext" title="下一個待確認（N）">▶</button>
  </span>
  <button id="btnBypass" title="暫時關閉閃避，聽原始音檔做比較">聽原始音檔</button>
  <label class="zoom" for="zoom">縮放 <input type="range" id="zoom" min="0" max="1000" value="0"></label>
  <div id="status" role="status" aria-live="polite"></div>
</footer>

<script>
'use strict';
/* ====================== 基本設定 ====================== */
const $ = (s, r = document) => r.querySelector(s);
const COLORS = ['#ff7a59', '#35c2b0', '#f2c14e', '#a08cff', '#5aa9ff', '#ff6fae'];
const HOP = 0.02;          // 分析用的音框長度（秒）
const PEAK_RES = 0.005;    // 波形快取解析度（秒）
let ROW_H = 92; const RULER_H = 26, MAX_TRACKS = 6;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const S = {
  ctx: null, master: null,
  tracks: [], duration: 0,
  view: { start: 0, pps: 20 },
  sel: null,                 // { ti, seg }
  selTrack: 0,
  params: { duckDb: -18, fadeMs: 120, preMs: 80, postMs: 220 },
  an: { dominance: 6, gate: 12, minGapMs: 400, minSegMs: 200, smoothMs: 100 },
  transcript: [], pending: null,
  playing: false, pos: 0, playOff: 0, playWhen: 0, playUntil: null,
  bypass: false, manual: false, demo: false,
  hist: [], future: [],
  ai: null, dl: null,
};

/* ====================== 工具函式 ====================== */
function pad(n, w = 2) { return String(n).padStart(w, '0'); }
function fmt(t, ms = true) {
  if (!isFinite(t)) t = 0;
  t = Math.max(0, t);
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = Math.floor(t % 60);
  const f = Math.floor((t % 1) * 1000 + 1e-6);
  const base = (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s);
  return ms ? base + '.' + pad(f, 3) : base;
}
function parseTime(v) {
  if (typeof v === 'number') return v;
  if (v == null) return NaN;
  let s = String(v).trim().replace(',', '.');
  if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  const p = s.split(':').map(Number);
  if (p.length < 2 || p.length > 3 || p.some(x => isNaN(x))) return NaN;
  return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
}
function percentile(arr, q, minVal = -90) {
  const step = Math.max(1, Math.floor(arr.length / 40000));
  const v = [];
  for (let i = 0; i < arr.length; i += step) if (arr[i] > minVal) v.push(arr[i]);
  if (!v.length) return minVal;
  v.sort((a, b) => a - b);
  return v[Math.min(v.length - 1, Math.floor(q * v.length))];
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
let statusTimer = 0;
function status(msg, kind = '', action = null) {
  const el = $('#status');
  el.className = kind; el.textContent = msg;
  if (action) {
    const b = document.createElement('button'); b.className = 'mini'; b.textContent = action.label;
    b.onclick = () => { action.fn(); status(''); };
    el.appendChild(b);
  }
  clearTimeout(statusTimer);
  if (msg && !action && kind !== 'err') statusTimer = setTimeout(() => { if (el.textContent === msg) status(''); }, 7000);
}
const tick = () => new Promise(r => setTimeout(r, 0));

/* ====================== 軌道 ====================== */
let uid = 0;
function newTrack(name) {
  const used = new Set(S.tracks.map(t => t.color));
  const color = COLORS.find(c => !used.has(c)) || COLORS[S.tracks.length % COLORS.length];
  return { id: ++uid, name: name || `講者 ${S.tracks.length + 1}`, color, fileName: '', fileSize: 0, buffer: null,
    ch0: null, ch1: null, peaks: null, db: null, norm: null, act: null, disp: 1, segs: [],
    mute: false, solo: false, src: null, duckNode: null, outNode: null };
}
const loaded = () => S.tracks.filter(t => t.buffer);
const hasAudio = () => S.tracks.some(t => t.buffer);

function ensureCtx(rate) {
  if (S.ctx) return S.ctx;
  try { S.ctx = new AudioContext(rate ? { sampleRate: rate } : undefined); }
  catch (e) { S.ctx = new AudioContext(); }
  S.master = S.ctx.createGain(); S.master.connect(S.ctx.destination);
  return S.ctx;
}
function sniffWavRate(ab) {
  try {
    const dv = new DataView(ab);
    if (dv.getUint32(0, false) !== 0x52494646) return 0;
    let p = 12;
    while (p + 8 <= dv.byteLength) {
      const id = dv.getUint32(p, false), sz = dv.getUint32(p + 4, true);
      if (id === 0x666d7420) return dv.getUint32(p + 12, true);
      p += 8 + sz + (sz & 1);

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();

  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (tag === 'button' && e.key === ' ') e.target.blur();
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod) return;
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'Delete': case 'Backspace': if (S.sel) { e.preventDefault(); deleteSel(); } break;
    case 's': case 'S': splitAt(curTime()); break;
    case 'i': case 'I': if (S.sel) { const p = curTime(); if (p < S.sel.seg.e - 0.05) editSeg(() => { S.sel.seg.s = p; normalizeSegs(S.tracks[S.sel.ti]); }); } break;
    case 'o': case 'O': if (S.sel) { const p = curTime(); if (p > S.sel.seg.s + 0.05) editSeg(() => { S.sel.seg.e = p; normalizeSegs(S.tracks[S.sel.ti]); }); } break;
    case 'ArrowLeft': e.preventDefault(); seek(curTime() - (e.shiftKey ? 5 : 1)); break;
    case 'ArrowRight': e.preventDefault(); seek(curTime() + (e.shiftKey ? 5 : 1)); break;
    case 'Home': seek(0); break;
    case 'n': case 'N': goReview(e.shiftKey ? -1 : 1); break;
    case 'Escape': S.sel = null; renderSel(); requestDraw(); break;
    case '=': case '+': setPps(S.view.pps * 1.5, curTime(), timeToX(curTime())); break;
    case '-': setPps(S.view.pps / 1.5, curTime(), timeToX(curTime())); break;

  const dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosT, true); lh.setUint16(12, dosD, true); lh.setUint32(14, f.crc, true);
    lh.setUint32(18, f.size, true); lh.setUint32(22, f.size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, f.blob);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true); cd.setUint16(12, dosT, true); cd.setUint16(14, dosD, true); cd.setUint32(16, f.crc, true);
    cd.setUint32(20, f.size, true); cd.setUint32(24, f.size, true); cd.setUint16(28, name.length, true);
    cd.setUint16(30, 0, true); cd.setUint16(32, 0, true); cd.setUint16(34, 0, true); cd.setUint16(36, 0, true);
    cd.setUint32(38, 0, true); cd.setUint32(42, off, true);
    cds.push(cd.buffer, name);
    off += 30 + name.length + f.size;
  }
  const cdSize = cds.reduce((a, b) => a + b.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...cds, end.buffer], { type: 'application/zip' });
}
function safeName(s) { return String(s).replace(/[\\/:*?"<>|]+/g, '_').trim() || 'track'; }
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
let dlUrls = [], lastSave = null;
function showLinks(files) {
  dlUrls.forEach(u => URL.revokeObjectURL(u)); dlUrls = [];
  const box = $('#exLinks'); box.innerHTML = '';
  for (const f of files) {
    const u = URL.createObjectURL(f.blob); dlUrls.push(u);
    const a = document.createElement('a'); a.href = u; a.download = f.name; a.className = 'dl'; a.textContent = '⬇ ' + f.name;
    box.appendChild(a);

}
async function getDl() {
  if (S.dl) return S.dl;
  if (!IN_CLAUDE) return null;
  let x = dlPromise ? await dlPromise : null;   // claude.use 最多 10 秒內一定會回覆
  if (!x) { dlPromise = window.claude.use('downloads').then(v => (S.dl = v)).catch(() => null); x = await dlPromise; }
  return x;
}
// 回傳：saved / links / declined / too_large / rate_limited / unavailable
async function saveFiles(files, zipName) {
  lastSave = { files, zipName };
  if (IN_CLAUDE) {
    const dl = await getDl();
    if (!dl) return 'unavailable';
    const single = files.length === 1 && /\.json$/i.test(files[0].name);
    try { await dl.save({ filename: single ? files[0].name : zipName, data: single ? files[0].blob : buildZip(files) }); return 'saved'; }
    catch (err) { return err?.code || 'unavailable'; }
  }
  const links = showLinks(files);
  for (const a of links) { a.click(); await new Promise(r => setTimeout(r, 700)); }
  return 'links';
}
function saveMsg(r, n) {
  return {
    saved: '完成。',
    links: '已開始下載。沒出現的話，點下方檔名。',
    declined: '已取消。',
    too_large: '檔案太大，請改用 16-bit 或不勾混音。',

}

/* ====================== 專案儲存 ====================== */
function projectData() {
  return {
    app: 'podcast-ducker', version: 1,
    params: { ...S.params }, analysis: { ...S.an },
    tracks: S.tracks.map(t => ({ name: t.name, fileName: t.fileName, segments: t.segs.map(g => ({ start: +g.s.toFixed(3), end: +g.e.toFixed(3) })) })),
    transcript: S.transcript.map(o => ({ start: o.start, end: o.end, speaker: o.speaker, text: o.text, track: o.track })),
  };
}
function applyProject(p) {
  if (!p || !Array.isArray(p.tracks)) { status('這不是本工具的專案檔。', 'err'); return; }
  const prev = snap();
  Object.assign(S.params, p.params || {}); Object.assign(S.an, p.analysis || {});
  p.tracks.forEach((pt, i) => {
    if (i >= MAX_TRACKS) return;
    while (S.tracks.length <= i) S.tracks.push(newTrack());
    const t = S.tracks[i];
    if (pt.name) t.name = pt.name;
    t.segs = (pt.segments || []).map(g => ({ s: +g.start, e: +g.end })).filter(g => isFinite(g.s) && isFinite(g.e));
    normalizeSegs(t);
  });
  S.transcript = Array.isArray(p.transcript) ? p.transcript : [];
  S.sel = null; S.manual = true;
  pushHist(prev);
  syncParams(); markPresets(); renderHeads(); resize(); renderTranscriptList(); changed();
  status('已還原專案的段落與設定。', 'ok');
}
$('#btnSaveProj').onclick = async () => {
  const txt = JSON.stringify(projectData(), null, 1), u8 = new TextEncoder().encode(txt);
  const r = await saveFiles([{ name: outName('專案', '.json'), blob: new Blob([u8]), crc: crcUpdate(0, u8), size: u8.length }], 'project.zip');
  status(r === 'saved' || r === 'links' ? '專案已儲存。' : saveMsg(r), r === 'saved' || r === 'links' ? 'ok' : 'err');
};

  if (!f) return;

function localKey() { const L = loaded(); return L.length && !S.demo ? 'ducker:' + L.map(t => t.fileName + ':' + t.fileSize).join('|') : null; }

/* ====================== 示範音檔 ====================== */
const DEMO_TRANSCRIPT = `A是主持人
B是來賓 A
C是來賓 B

00:00:00.400-00:00:07.600 A
00:00:08.100-00:00:21.000 B
00:00:21.500-00:00:25.000 A
00:00:25.500-00:00:38.000 C
00:00:38.000-00:00:39.000 B
00:00:40.000-00:00:44.000 A
00:00:44.500-00:00:58.000 B
00:00:59.000-00:01:10.000 C
00:01:10.500-00:01:16.000 A
00:01:16.400-00:01:24.000 B
00:01:24.500-00:01:29.000 A`;
function makeDemo() {
  pause();
  const sr = 24000, dur = 90, n = sr * dur;
  let seed = 12345; const R = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const spk = [{ name: '主持人', f0: 118 }, { name: '來賓 A', f0: 205 }, { name: '來賓 B', f0: 152 }];
  const turns = [[0, 0.5, 7.5], [1, 8.2, 21], [0, 14.0, 14.45], [0, 21.6, 25], [2, 25.6, 38], [1, 37.2, 39], [0, 40, 44],
    [1, 44.6, 58], [2, 50.2, 50.6], [2, 59, 70], [0, 70.5, 76], [1, 76.4, 84], [0, 84.6, 89]];
  const voices = spk.map(() => new Float32Array(n));
  for (const [si, a, b] of turns) {
    const v = voices[si], f0 = spk[si].f0;
    let t = a;
    while (t < b) {
      const syl = 0.11 + R() * 0.2, gap = R() < 0.12 ? 0.25 + R() * 0.35 : 0.03 + R() * 0.08;
      const s0 = Math.floor(t * sr), s1 = Math.min(Math.floor(Math.min(b, t + syl) * sr), n);
      const amp = 0.18 + R() * 0.12, pitch = f0 * (1 + (R() - 0.5) * 0.18), glide = (R() - 0.5) * 0.25;
      const hw = [1, 0.55 + R() * 0.4, 0.3 + R() * 0.5, 0.2 + R() * 0.4, 0.12 + R() * 0.25, 0.08 + R() * 0.15];
      let ph = 0;
      const L = Math.max(1, s1 - s0);
      for (let i = s0; i < s1; i++) {
        const x = (i - s0) / L;
        const env = Math.sin(Math.PI * Math.min(1, x * 1.15)) ** 1.5;
        ph += 2 * Math.PI * pitch * (1 + glide * x) / sr;
        let s = 0; for (let k = 0; k < 6; k++) s += hw[k] * Math.sin(ph * (k + 1)) / (k + 1);
        v[i] += amp * env * (s * 0.8 + (R() - 0.5) * 0.12);
      }
      t += syl + gap;
    }
  }
  const bleed = [[1, 0.16, 0.13], [0.15, 1, 0.2], [0.55, 0.6, 2.2]];  // 第三軌：增益偏高、串音很重（模擬便宜麥克風）
  S.tracks = [];
  for (let i = 0; i < 3; i++) {
    const t = newTrackReset(i); t.name = spk[i].name; t.fileName = '示範音檔（合成）';
    const buf = new AudioBuffer({ length: n, sampleRate: sr, numberOfChannels: 1 });
    const d = buf.getChannelData(0);
    for (let j = 0; j < n; j++) {
      d[j] = voices[0][j] * bleed[i][0] + voices[1][j] * bleed[i][1] + voices[2][j] * bleed[i][2] + (R() - 0.5) * 0.003;
    }
    t.buffer = buf; computeFeatures(t);
    S.tracks.push(t);
  }
  S.demo = true; S.transcript = []; S.pending = null; S.pos = 0; S.hist = []; S.future = [];
  $('#trText').value = DEMO_TRANSCRIPT; $('#mapBox').hidden = true; $('#trMsg').textContent = '';
  $('#demoBanner').hidden = false;
  updateDuration(); renderHeads(); resize();
  S.view.start = 0; S.view.pps = minPps(); clampView(); syncZoom();
  analyze(true); S.hist = []; changed();
  renderTranscriptList();
}
